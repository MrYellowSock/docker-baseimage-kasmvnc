server {
  #auth_basic               "Login";
  #auth_basic_user_file     /etc/nginx/.htpasswd;
  listen 3000 default_server;
  listen [::]:3000 default_server;

# How both 6900 & 6901 works
# - (6901) kasmweb server (real server) (webpage file & websocket)
# - (6900) linuxserver/kclient server (dummy nodejs server)
#       - Role:
#               - index.html create iframe with parametized url to pass correct parameter (websocket path) to kasmweb
#                       - the original kasmweb defaults its websocket path to root (/) which is bad reverse proxy setting.
#               - forward static files request to kasmweb server.
#               - provide file picker ,audio in/out
#       - The problem
#               - This thing doesnt handle basic auth , or forward websocket(reason why we are seeing seperate entry).
#               - iframe doesnt do well with basic auth too....
#               - This little shit might be responsible for shared session connection too. but cant exactly prove it.
#               - https://. . .: .. /SUBFOLDER/vnc/index.html (iframe) -> to  6901 server
  location / {
    proxy_http_version      1.1;
    proxy_set_header        Host $host;
    proxy_set_header        Upgrade $http_upgrade;
    proxy_set_header        Connection "upgrade";
    proxy_set_header        X-Real-IP $remote_addr;
    proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_set_header        Cookie "";
    proxy_read_timeout      3600s;
    proxy_send_timeout      3600s;
    proxy_hide_header       X-Frame-Options;
    proxy_hide_header       Content-Security-Policy;
    add_header              'X-Frame-Options' 'ALLOWALL';
    add_header              'Content-Security-Policy' 'frame-ancestors *';
    add_header              'Access-Control-Allow-Origin' '*' always;
    add_header              'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
    add_header              'Access-Control-Allow-Headers' 'Authorization,Content-Type,Accept,Origin,User-Agent,DNT,Cache-Control,X-Mx-ReqToken,Keep-Alive,X-Requested-With,If-Modified-Since';
    add_header              'Access-Control-Allow-Credentials' 'true';
    add_header              'Cross-Origin-Embedder-Policy' 'unsafe-none';
    add_header              'Cross-Origin-Opener-Policy' 'unsafe-none';
    add_header              'Cross-Origin-Resource-Policy' 'cross-origin';
    proxy_pass               http://127.0.0.1:6900;
    proxy_buffering          off;
  }

  location SUBFOLDERvnc/ {
    proxy_http_version      1.1;
    proxy_set_header        Host $host;
    proxy_set_header        Upgrade $http_upgrade;
    proxy_set_header        Connection "upgrade";
    proxy_set_header        X-Real-IP $remote_addr;
    proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_set_header        Cookie "";
    proxy_read_timeout      3600s;
    proxy_send_timeout      3600s;
    proxy_hide_header       X-Frame-Options;
    proxy_hide_header       Content-Security-Policy;
    add_header              'X-Frame-Options' 'ALLOWALL';
    add_header              'Content-Security-Policy' 'frame-ancestors *';
    add_header              'Access-Control-Allow-Origin' '*' always;
    add_header              'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
    add_header              'Access-Control-Allow-Headers' 'Authorization,Content-Type,Accept,Origin,User-Agent,DNT,Cache-Control,X-Mx-ReqToken,Keep-Alive,X-Requested-With,If-Modified-Since';
    add_header              'Access-Control-Allow-Credentials' 'true';
    add_header              'Cross-Origin-Embedder-Policy' 'unsafe-none';
    add_header              'Cross-Origin-Opener-Policy' 'unsafe-none';
    add_header              'Cross-Origin-Resource-Policy' 'cross-origin';
    proxy_pass               http://127.0.0.1:6901/;
    proxy_buffering          off;
  }

  location SUBFOLDERwebsockify {
    proxy_http_version      1.1;
    proxy_set_header        Host $host;
    proxy_set_header        Upgrade $http_upgrade;
    proxy_set_header        Connection "upgrade";
    proxy_set_header        X-Real-IP $remote_addr;
    proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_set_header        Cookie "";
    proxy_read_timeout      3600s;
    proxy_send_timeout      3600s;
    proxy_hide_header       X-Frame-Options;
    proxy_hide_header       Content-Security-Policy;
    add_header              'X-Frame-Options' 'ALLOWALL';
    add_header              'Content-Security-Policy' 'frame-ancestors *';
    add_header              'Access-Control-Allow-Origin' '*' always;
    add_header              'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
    add_header              'Access-Control-Allow-Headers' 'Authorization,Content-Type,Accept,Origin,User-Agent,DNT,Cache-Control,X-Mx-ReqToken,Keep-Alive,X-Requested-With,If-Modified-Since';
    add_header              'Access-Control-Allow-Credentials' 'true';
    add_header              'Cross-Origin-Embedder-Policy' 'unsafe-none';
    add_header              'Cross-Origin-Opener-Policy' 'unsafe-none';
    add_header              'Cross-Origin-Resource-Policy' 'cross-origin';
    proxy_pass               http://127.0.0.1:6901;
    proxy_buffering          off;
  }
}


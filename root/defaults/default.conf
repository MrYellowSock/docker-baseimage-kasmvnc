server {
  #auth_basic               "Login";
  #auth_basic_user_file     /etc/nginx/.htpasswd;
  listen 3000 default_server;
  listen [::]:3000 default_server;

  # Redirect root to VNC with proper websocket path parameters
  location = SUBFOLDER {
    return 302 SUBFOLDERvnc/index.html?$args&autoconnect=1&resize=remote&clipboard_up=true&clipboard_down=true&clipboard_seamless=true&show_control_bar=true&path=SUBFOLDERwebsockify;
  }

  location SUBFOLDERvnc/ {
    proxy_http_version      1.1;
    proxy_set_header        Host $host;
    proxy_set_header        Upgrade $http_upgrade;
    proxy_set_header        Connection "upgrade";
    proxy_set_header        X-Real-IP $remote_addr;
    proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_set_header        Cookie "";
    proxy_read_timeout      3600s;
    proxy_send_timeout      3600s;
    proxy_hide_header       X-Frame-Options;
    proxy_hide_header       Content-Security-Policy;
    add_header              'X-Frame-Options' 'ALLOWALL';
    add_header              'Content-Security-Policy' 'frame-ancestors *';
    add_header              'Access-Control-Allow-Origin' '*' always;
    add_header              'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
    add_header              'Access-Control-Allow-Headers' 'Authorization,Content-Type,Accept,Origin,User-Agent,DNT,Cache-Control,X-Mx-ReqToken,Keep-Alive,X-Requested-With,If-Modified-Since';
    add_header              'Access-Control-Allow-Credentials' 'true';
    add_header              'Cross-Origin-Embedder-Policy' 'unsafe-none';
    add_header              'Cross-Origin-Opener-Policy' 'unsafe-none';
    add_header              'Cross-Origin-Resource-Policy' 'cross-origin';
    proxy_pass               http://127.0.0.1:6901/;
    proxy_buffering          off;
  }

  location SUBFOLDERwebsockify {
    proxy_http_version      1.1;
    proxy_set_header        Host $host;
    proxy_set_header        Upgrade $http_upgrade;
    proxy_set_header        Connection "upgrade";
    proxy_set_header        X-Real-IP $remote_addr;
    proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_set_header        Cookie "";
    proxy_read_timeout      3600s;
    proxy_send_timeout      3600s;
    proxy_hide_header       X-Frame-Options;
    proxy_hide_header       Content-Security-Policy;
    add_header              'X-Frame-Options' 'ALLOWALL';
    add_header              'Content-Security-Policy' 'frame-ancestors *';
    add_header              'Access-Control-Allow-Origin' '*' always;
    add_header              'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
    add_header              'Access-Control-Allow-Headers' 'Authorization,Content-Type,Accept,Origin,User-Agent,DNT,Cache-Control,X-Mx-ReqToken,Keep-Alive,X-Requested-With,If-Modified-Since';
    add_header              'Access-Control-Allow-Credentials' 'true';
    add_header              'Cross-Origin-Embedder-Policy' 'unsafe-none';
    add_header              'Cross-Origin-Opener-Policy' 'unsafe-none';
    add_header              'Cross-Origin-Resource-Policy' 'cross-origin';
    proxy_pass               http://127.0.0.1:6901;
    proxy_buffering          off;
  }
}

